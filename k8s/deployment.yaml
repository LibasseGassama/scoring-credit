apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-scoring
spec:
  replicas: 1
  selector:
    matchLabels:
      app: scoring-credit
  template:
    metadata:
      labels:
        app: scoring-credit
    spec:
      containers:
        - name: api
          image: scoring-credit:1.0
          imagePullPolicy: Never
          ports:
            - containerPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: api-scoring
spec:
  selector:
    app: scoring-credit
  ports:
    - port: 80
      targetPort: 8000
