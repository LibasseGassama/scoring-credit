name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installer Poetry et les dépendances
        run: |
          pip install poetry
          poetry install

      - name: Lancer les tests
        run: poetry run pytest -v

  scan:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Construire l'image Docker
        run: docker build -t scoring-credit:1.0 .

      - name: Scanner l'image avec Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: scoring-credit:1.0
          severity: HIGH,CRITICAL
          exit-code: "0"
          format: table

  build:
    needs: scan
    runs-on: ubuntu-latest
    if: success()
    steps:
      - uses: actions/checkout@v4

      - name: Construire l'image Docker
        run: docker build -t scoring-credit:1.0 .

      - name: Se connecter à GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tagger et pousser l'image
        run: |
          docker tag scoring-credit:1.0 ghcr.io/libassegassama/scoring-credit:1.0
          docker push ghcr.io/libassegassama/scoring-credit:1.0