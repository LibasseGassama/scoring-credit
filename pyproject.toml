[tool.poetry]
name = "scoring-credit"
version = "0.1.0"
description = "TP1 MLOps - Du prototype au modele servi"
authors = ["Libas"]
package-mode = false

[tool.poetry.dependencies]
python = ">=3.10,<3.13"

# ⚠️ CORRECTIONS DE SÉCURITÉ CRITIQUES
pandas = "^2.2"
scikit-learn = "^1.5"
mlflow = ">=3.15.0"              # ← CRITIQUE: 8 vulnérabilités critiques (était ^2.16)
dvc = "^3.55"
fastapi = "^0.115"
uvicorn = "^0.30"
pydantic = "^2.9"
joblib = "^1.4"
redis = "^5.0"
prometheus-client = "^0.20"
evidently = "^0.4"

# ⚠️ NOUVELLES DÉPENDANCES POUR CORRIGER LES VULNÉRABILITÉS
starlette = ">=1.3.1"            # ← CRITIQUE: CVE-2026-54283 (dépendance de FastAPI)
pyarrow = ">=23.0.1"             # ← CRITIQUE: CVE-2026-25087 (utilisé par pandas/MLflow)
setuptools = ">=78.1.1"          # ← HIGH: CVE-2025-47273
wheel = ">=0.46.2"               # ← HIGH: CVE-2026-24049
nltk = ">=3.10.4"                # ← HIGH: CVE-2026-81726 (utilisé par MLflow)
jaraco.context = ">=6.1.0"       # ← HIGH: CVE-2026-23949

[tool.poetry.group.dev.dependencies]
pytest = "^8.3"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"