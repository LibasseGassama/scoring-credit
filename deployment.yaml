apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-scoring
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api-scoring
  template:
    metadata:
      labels:
        app: api-scoring
    spec:
      containers:
        - name: api
          image: scoring-credit:1.0
          ports:
            - containerPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: api-scoring
spec:
  selector:
    app: api-scoring
  ports:
    - port: 80
      targetPort: 8000
