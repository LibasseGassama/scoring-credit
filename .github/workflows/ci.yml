name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Installer Poetry et les dépendances
        run: |
          pip install poetry
          poetry lock
          poetry install
      - name: Lancer les tests
        run: poetry run pytest -v

  scan:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Créer le répertoire et le modèle factice
        run: |
          mkdir -p models
          if [ ! -f models/modele.pkl ]; then
            echo "Création d'un modèle factice pour le build"
            python -c "
          import pickle
          dummy_model = {
              'version': '1.0',
              'type': 'dummy_classifier',
              'data': 'placeholder'
          }
          with open('models/modele.pkl', 'wb') as f:
              pickle.dump(dummy_model, f)
          "
          fi
      - name: Construire l'image pour le scan
        run: docker build -t scoring-credit:1.0 .
      - name: Scanner l'image avec Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "scoring-credit:1.0"
          severity: "HIGH,CRITICAL"
          exit-code: "1"

  build:
    needs: scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Créer le répertoire et le modèle factice
        run: |
          mkdir -p models
          if [ ! -f models/modele.pkl ]; then
            echo "Création d'un modèle factice pour le build"
            python -c "
          import pickle
          dummy_model = {
              'version': '1.0',
              'type': 'dummy_classifier',
              'data': 'placeholder'
          }
          with open('models/modele.pkl', 'wb') as f:
              pickle.dump(dummy_model, f)
          "
          fi
      - name: Connexion à GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Construire et pousser l'image
        run: |
          docker build -t ghcr.io/${{ github.repository_owner }}/scoring-credit:1.0 .
          docker push ghcr.io/${{ github.repository_owner }}/scoring-credit:1.0